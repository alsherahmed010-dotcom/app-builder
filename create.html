<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر قالب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0f;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 25px;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 24px; color: #667eea; }
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .template-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .template-card:hover {
            background: rgba(102,126,234,0.1);
            border-color: #667eea;
            transform: translateY(-5px);
        }
        .template-card .icon { font-size: 50px; margin-bottom: 10px; }
        .template-card h3 { font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 اختر قالب</h1>
        </div>
        <div class="templates-grid">
            <div class="template-card" onclick="selectTemplate('chat')">
                <div class="icon">💬</div>
                <h3>تطبيق شات</h3>
            </div>
            <div class="template-card" onclick="selectTemplate('social')">
                <div class="icon">📱</div>
                <h3>سوشيال ميديا</h3>
            </div>
            <div class="template-card" onclick="selectTemplate('whatsapp')">
                <div class="icon">🟢</div>
                <h3>واتساب</h3>
            </div>
            <div class="template-card" onclick="selectTemplate('tiktok')">
                <div class="icon">🎵</div>
                <h3>تيك توك</h3>
            </div>
        </div>
    </div>
    <script>
        function selectTemplate(template) {
            localStorage.setItem('template', template);
            location.href = 'settings.html';
        }
    </script>
</body>
</html>
