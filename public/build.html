<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري البناء</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0d1117; min-height: 100vh; color: #e6edf3; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 15px; }
        .nav-btn { padding: 10px 25px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 700; }
        .nav-btn.active { background: #238636; color: white; }
        .nav-btn.inactive { background: #21262d; color: #c9d1d9; }
        .container { max-width: 500px; margin: 60px auto; padding: 30px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; text-align: center; }
        .spinner { border: 4px solid #30363d; border-top: 4px solid #238636; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .logs { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 15px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; text-align: right; margin-top: 15px; color: #8b949e; }
        .download-btn { display: none; width: 100%; padding: 15px; background: #238636; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; text-decoration: none; }
        .download-btn.show { display: block; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/create.html" class="nav-btn inactive">إنشاء</a>
        <a href="/my-apps.html" class="nav-btn active">تطبيقاتي</a>
    </nav>
    <div class="container">
        <h3 style="font-size:18px;font-weight:800;">🔨 جاري البناء...</h3>
        <div class="spinner"></div>
        <p style="font-size:13px;color:#8b949e;">يرجى الانتظار</p>
        <div class="logs" id="logs"></div>
        <a href="#" class="download-btn" id="downloadBtn">⬇️ تحميل APK</a>
        <a href="/my-apps.html" style="display:block;margin-top:15px;color:#58a6ff;text-decoration:none;font-size:13px;">→ تطبيقاتي</a>
    </div>
    <script>
        const API_URL = 'https://app-builder-production-ab4d.up.railway.app';
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('id');
        const logs = document.getElementById('logs');
        
        function addLog(msg) { const div = document.createElement('div'); div.textContent = msg; logs.appendChild(div); logs.scrollTop = logs.scrollHeight; }
        
        async function startBuild() {
            addLog('🔨 بدء البناء...');
            try {
                await fetch(`${API_URL}/api/build/${appId}`, { method: 'POST' });
                addLog('✅ بدأ البناء!');
                const check = setInterval(async () => {
                    try {
                        const res = await fetch(`${API_URL}/api/build-status/${appId}`);
                        const data = await res.json();
                        if (data.status === 'completed') {
                            clearInterval(check);
                            addLog('✅ اكتمل!');
                            const btn = document.getElementById('downloadBtn');
                            btn.href = API_URL + data.apk_url;
                            btn.classList.add('show');
                        } else if (data.status === 'failed') {
                            clearInterval(check);
                            addLog('❌ فشل البناء');
                        }
                    } catch (err) {}
                }, 5000);
            } catch (err) { addLog('❌ فشل'); }
        }
        startBuild();
    </script>
</body>
</html>
