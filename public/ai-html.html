<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI HTML</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0d1117; min-height: 100vh; color: #e6edf3; display: flex; flex-direction: column; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 10px; }
        .nav-btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; }
        .nav-btn.active { background: #1f6feb; color: white; }
        .nav-btn.inactive { background: #21262d; color: #c9d1d9; }
        
        .chat-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; height: calc(100vh - 60px); }
        .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding: 10px 0; }
        
        .message { display: flex; gap: 10px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .message.user .avatar { background: #1f6feb; }
        .message.ai .avatar { background: #238636; }
        .bubble { background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 12px 15px; font-size: 14px; line-height: 1.7; word-wrap: break-word; }
        .message.user .bubble { background: #1f6feb20; border-color: #1f6feb50; }
        
        .code-block { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 15px; margin-top: 10px; font-family: monospace; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; max-height: 300px; overflow-y: auto; }
        .code-actions { display: flex; gap: 8px; margin-top: 8px; }
        .action-btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; text-decoration: none; text-align: center; }
        .copy-btn { background: #238636; color: white; }
        .preview-btn { background: #d29922; color: white; }
        
        .input-area { display: flex; gap: 10px; padding: 15px 0; border-top: 1px solid #30363d; }
        .chat-input { flex: 1; padding: 14px; background: #161b22; border: 1px solid #30363d; border-radius: 25px; font-size: 14px; color: #e6edf3; font-family: inherit; }
        .chat-input:focus { outline: none; border-color: #1f6feb; }
        .send-btn { padding: 14px 25px; background: #1f6feb; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: 700; }
        .send-btn:disabled { opacity: 0.5; }
        .typing { display: none; align-self: flex-start; color: #8b949e; font-size: 13px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/create.html" class="nav-btn inactive">إنشاء</a>
        <a href="/ai-html.html" class="nav-btn active">AI HTML</a>
        <a href="/my-apps.html" class="nav-btn inactive">تطبيقاتي</a>
    </nav>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message ai">
                <div class="avatar">🤖</div>
                <div class="bubble">مرحباً! أنا AI HTML. اكتب أي سؤال أو اطلب مني إنشاء HTML وسأعرض لك الكود مع أزرار نسخ ومعاينة.</div>
            </div>
        </div>
        <div class="typing" id="typing">🤖 جاري الكتابة...</div>
        <div class="input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://apihub.agnes-ai.com/v1/chat/completions';
        const API_KEY = 'sk-eV8aSN0NWxNYGnTdvws5nIGAcMWvUk0G2i0u5MdGIdyl2H1Q';
        
        function addMessage(role, content, isCode = false) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="bubble">${content}${isCode ? `
                    <div class="code-block">${content}</div>
                    <div class="code-actions">
                        <button class="action-btn copy-btn" onclick="copyCode(this)">📋 نسخ</button>
                        <a href="#" class="action-btn preview-btn" onclick="previewCode(this)">👁️ معاينة</a>
                    </div>
                ` : ''}</div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function copyCode(btn) {
            const codeBlock = btn.parentElement.parentElement.querySelector('.code-block').textContent;
            navigator.clipboard.writeText(codeBlock).then(() => {
                btn.textContent = '✅ تم!';
                setTimeout(() => btn.textContent = '📋 نسخ', 2000);
            });
        }
        
        function previewCode(btn) {
            const codeBlock = btn.parentElement.parentElement.querySelector('.code-block').textContent;
            localStorage.setItem('preview-html', codeBlock);
            window.open('/preview.html', '_blank');
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const q = input.value.trim();
            if (!q) return;
            
            addMessage('user', q);
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('typing').style.display = 'block';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'agnes-2.5-pro',
                        messages: [{role: 'user', content: q}],
                        max_tokens: 4000
                    })
                });
                
                const data = await response.json();
                const content = data.choices[0].message.content;
                
                // فحص إذا كان HTML
                if (content.includes('<') && content.includes('>') && (content.includes('html') || content.includes('div') || content.includes('body'))) {
                    const match = content.match(/```html\n([\s\S]*?)```/) || content.match(/```\n([\s\S]*?)```/);
                    const code = match ? match[1] : content;
                    addMessage('ai', code, true);
                } else {
                    addMessage('ai', content);
                }
            } catch (err) {
                addMessage('ai', '❌ فشل الاتصال');
            }
            
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('typing').style.display = 'none';
        }
    </script>
</body>
</html>
