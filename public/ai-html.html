<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0d1117; min-height: 100vh; color: #e6edf3; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 10px; align-items: center; }
        .nav-btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; }
        .nav-btn.inactive { background: #21262d; color: #c9d1d9; }
        .ai-icon-btn { background: #1f6feb; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .chat-modal { display: none; position: fixed; inset: 0; background: #0d1117; z-index: 1000; flex-direction: column; }
        .chat-modal.show { display: flex; }
        .modal-header { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 16px; font-weight: 800; color: #58a6ff; }
        .close-btn { width: 35px; height: 35px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px; background: #21262d; color: #c9d1d9; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; gap: 10px; max-width: 85%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.ai { align-self: flex-start; }
        .av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .msg.user .av { background: #1f6feb; }
        .msg.ai .av { background: #238636; }
        .bub { background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 12px 15px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; color: #e6edf3; }
        .msg.user .bub { background: #1f6feb20; }
        .code { background: #0d1117; border: 1px solid #238636; border-radius: 10px; padding: 15px; margin-top: 10px; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-wrap: break-word; color: #3fb950; max-height: 350px; overflow-y: auto; }
        .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .ab { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 11px; font-weight: 700; text-decoration: none; display: inline-block; }
        .ab-copy { background: #238636; color: white; }
        .ab-prev { background: #d29922; color: white; }
        .ab-use { background: #1f6feb; color: white; }
        .dots { display: none; gap: 4px; background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 12px; align-self: flex-start; }
        .dots span { width: 8px; height: 8px; background: #8b949e; border-radius: 50%; animation: b 1.4s infinite; }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes b { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
        .inp-area { display: flex; gap: 10px; padding: 15px 20px; border-top: 1px solid #30363d; max-width: 800px; width: 100%; margin: 0 auto; }
        .inp { flex: 1; padding: 14px; background: #161b22; border: 1px solid #30363d; border-radius: 25px; color: #e6edf3; font-size: 14px; font-family: inherit; outline: none; }
        .snd { padding: 14px 25px; background: #1f6feb; color: white; border: none; border-radius: 25px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/create.html" class="nav-btn inactive">➕ إنشاء</a>
        <button class="ai-icon-btn" onclick="toggle()">🤖</button>
        <a href="/my-apps.html" class="nav-btn inactive">📱 تطبيقاتي</a>
    </nav>
    
    <div class="chat-modal" id="modal">
        <div class="modal-header">
            <span class="modal-title">🤖 AI</span>
            <button class="close-btn" onclick="toggle()">✕</button>
        </div>
        <div class="messages" id="msgs"></div>
        <div class="dots" id="dots"><span></span><span></span><span></span></div>
        <div class="inp-area">
            <input class="inp" id="inp" placeholder="اكتب..." onkeypress="if(event.key==='Enter')send()">
            <button class="snd" id="snd" onclick="send()">إرسال</button>
        </div>
    </div>

    <script>
        const KEY = 'sk-eV8aSN0NWxNYGnTdvws5nIGAcMWvUk0G2i0u5MdGIdyl2H1Q';
        function toggle() { document.getElementById('modal').classList.toggle('show'); if (document.getElementById('modal').classList.contains('show')) document.getElementById('inp').focus(); }
        function hist() { try { return JSON.parse(localStorage.getItem('ai') || '[]'); } catch { return []; } }
        function save(h) { localStorage.setItem('ai', JSON.stringify(h)); }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function isH(s) { const t = s.trim(); return t.startsWith('<!DOCTYPE') || t.startsWith('<html') || (t.includes('<') && t.includes('</')); }
        function render(role, content) {
            const c = document.getElementById('msgs');
            const d = document.createElement('div');
            d.className = 'msg ' + role;
            if (role === 'ai' && isH(content)) {
                const m = content.match(/```html\n([\s\S]*?)```/) || content.match(/```\n([\s\S]*?)```/);
                const code = m ? m[1] : content;
                const text = content.replace(/```html[\s\S]*```/, '').replace(/```[\s\S]*```/, '').trim();
                d.innerHTML = `<div class="av">🤖</div><div class="bub">${text ? esc(text) + '<br>' : ''}<div class="code">${esc(code)}</div><div class="acts"><button class="ab ab-copy" onclick="cp(this)">📋 نسخ</button><a href="/preview.html" target="_blank" class="ab ab-prev" onclick="sp(this)">👁️ معاينة</a><button class="ab ab-use" onclick="us(this)">🚀 استخدام</button></div></div>`;
            } else {
                d.innerHTML = `<div class="av">${role === 'user' ? '👤' : '🤖'}</div><div class="bub">${esc(content)}</div>`;
            }
            c.appendChild(d); c.scrollTop = c.scrollHeight;
        }
        function load() { document.getElementById('msgs').innerHTML = ''; hist().forEach(m => render(m.role, m.content)); }
        function cp(b) { navigator.clipboard.writeText(b.closest('.bub').querySelector('.code').textContent).then(() => { b.textContent = '✅'; setTimeout(() => b.textContent = '📋 نسخ', 2000); }); }
        function sp(b) { localStorage.setItem('pv', b.closest('.bub').querySelector('.code').textContent); }
        function us(b) { localStorage.setItem('gc', b.closest('.bub').querySelector('.code').textContent); window.location.href = '/create.html'; }
        async function send() {
            const inp = document.getElementById('inp'); const q = inp.value.trim(); if (!q) return;
            render('user', q); inp.value = '';
            document.getElementById('snd').disabled = true;
            document.getElementById('dots').style.display = 'flex';
            const h = hist(); const api = h.map(m => ({role: m.role, content: m.content})); api.push({role: 'user', content: q});
            h.push({role: 'user', content: q}); save(h);
            try {
                const r = await fetch('https://apihub.agnes-ai.com/v1/chat/completions', { method: 'POST', headers: {'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json'}, body: JSON.stringify({model: 'agnes-2.5-pro', messages: api, max_tokens: 4000}) });
                const data = await r.json(); const content = data.choices[0].message.content;
                h.push({role: 'assistant', content}); save(h);
                document.getElementById('dots').style.display = 'none';
                render('ai', content);
            } catch(e) { document.getElementById('dots').style.display = 'none'; render('ai', '❌ فشل'); }
            document.getElementById('snd').disabled = false;
        }
        load();
    </script>
</body>
</html>
