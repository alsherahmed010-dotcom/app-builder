<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0d1117; min-height: 100vh; color: #e6edf3; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 10px; align-items: center; }
        .nav-btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; }
        .nav-btn.active { background: #238636; color: white; }
        .nav-btn.inactive { background: #21262d; color: #c9d1d9; }
        .ai-icon-btn { background: #1f6feb; color: white; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(31,111,235,0.5); }
        
        .chat-modal { display: flex; position: fixed; inset: 0; background: #0d1117; z-index: 1000; flex-direction: column; }
        .modal-header { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 16px; font-weight: 800; color: #58a6ff; }
        .close-btn { width: 35px; height: 35px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px; background: #21262d; color: #c9d1d9; display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background: #da3633; color: white; }
        
        .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding: 20px; max-width: 800px; width: 100%; margin: 0 auto; }
        
        .message { display: flex; gap: 10px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .message.user .avatar { background: #1f6feb; }
        .message.ai .avatar { background: #238636; }
        .bubble { background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 12px 15px; font-size: 14px; line-height: 1.7; word-wrap: break-word; color: #e6edf3; white-space: pre-wrap; }
        .message.user .bubble { background: #1f6feb20; border-color: #1f6feb50; }
        
        .code-block { background: #0d1117; border: 1px solid #238636; border-radius: 10px; padding: 15px; margin-top: 10px; font-family: monospace; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; color: #3fb950; }
        .code-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .action-btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; text-decoration: none; text-align: center; display: inline-block; }
        .copy-btn { background: #238636; color: white; }
        .preview-btn { background: #d29922; color: white; }
        .use-btn { background: #1f6feb; color: white; }
        
        .typing-dots { display: none; align-self: flex-start; gap: 4px; background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 15px; }
        .typing-dots span { width: 8px; height: 8px; background: #8b949e; border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
        
        .input-area { display: flex; gap: 10px; padding: 15px 20px; border-top: 1px solid #30363d; max-width: 800px; width: 100%; margin: 0 auto; background: #0d1117; }
        .chat-input { flex: 1; padding: 14px; background: #161b22; border: 1px solid #30363d; border-radius: 25px; font-size: 14px; color: #e6edf3; font-family: inherit; }
        .chat-input:focus { outline: none; border-color: #1f6feb; }
        .send-btn { padding: 14px 25px; background: #1f6feb; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: 700; }
        .send-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/create.html" class="nav-btn inactive">➕ إنشاء</a>
        <button class="ai-icon-btn" onclick="toggleChat()" title="AI">🤖</button>
        <a href="/my-apps.html" class="nav-btn inactive">📱 تطبيقاتي</a>
    </nav>
    
    <div class="chat-modal" id="chatModal" style="display:none;">
        <div class="modal-header">
            <div class="modal-title">🤖 AI مساعد</div>
            <button class="close-btn" onclick="toggleChat()">✕</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="typing-dots" id="typingDots">
            <span></span><span></span><span></span>
        </div>
        <div class="input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://apihub.agnes-ai.com/v1/chat/completions';
        const API_KEY = 'sk-eV8aSN0NWxNYGnTdvws5nIGAcMWvUk0G2i0u5MdGIdyl2H1Q';
        
        function toggleChat() {
            const modal = document.getElementById('chatModal');
            if (modal.style.display === 'none') {
                modal.style.display = 'flex';
                document.getElementById('chatInput').focus();
            } else {
                modal.style.display = 'none';
            }
        }
        
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('ai-history') || '[]'); }
            catch { return []; }
        }
        
        function saveHistory(history) {
            localStorage.setItem('ai-history', JSON.stringify(history));
        }
        
        function isHTML(code) {
            const trimmed = code.trim();
            return trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html') || (trimmed.includes('<') && trimmed.includes('</') && (trimmed.includes('<div') || trimmed.includes('<body') || trimmed.includes('<style') || trimmed.includes('<head')));
        }
        
        function renderMessage(role, content) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (role === 'ai' && isHTML(content)) {
                const match = content.match(/```html\n([\s\S]*?)```/) || content.match(/```\n([\s\S]*?)```/);
                const code = match ? match[1] : content;
                const textPart = content.replace(/```html[\s\S]*```/, '').replace(/```[\s\S]*```/, '').trim();
                
                div.innerHTML = `<div class="avatar">🤖</div>
                    <div class="bubble">
                        ${textPart ? `<div style="color:#e6edf3;">${textPart}</div>` : ''}
                        <div class="code-block">${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                        <div class="code-actions">
                            <button class="action-btn copy-btn" onclick="copyCode(this)">📋 نسخ</button>
                            <a href="#" class="action-btn preview-btn" onclick="previewCode(this)">👁️ معاينة</a>
                            <button class="action-btn use-btn" onclick="useCode(this)">🚀 استخدام</button>
                        </div>
                    </div>`;
            } else {
                div.innerHTML = `<div class="avatar">${role === 'user' ? '👤' : '🤖'}</div><div class="bubble">${content}</div>`;
            }
            
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function loadHistory() {
            getHistory().forEach(msg => renderMessage(msg.role, msg.content));
        }
        
        function copyCode(btn) {
            const codeBlock = btn.parentElement.parentElement.querySelector('.code-block').textContent;
            navigator.clipboard.writeText(codeBlock).then(() => {
                btn.textContent = '✅ تم!';
                setTimeout(() => btn.textContent = '📋 نسخ', 2000);
            });
        }
        
        function previewCode(btn) {
            const codeBlock = btn.parentElement.parentElement.querySelector('.code-block').textContent;
            localStorage.setItem('preview-html', codeBlock);
            window.open('/preview.html', '_blank');
        }
        
        function useCode(btn) {
            const codeBlock = btn.parentElement.parentElement.querySelector('.code-block').textContent;
            localStorage.setItem('generated-code', codeBlock);
            window.location.href = '/create.html?from=ai';
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const q = input.value.trim();
            if (!q) return;
            
            renderMessage('user', q);
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
            
            const typingDots = document.getElementById('typingDots');
            typingDots.style.display = 'flex';
            typingDots.scrollIntoView({ behavior: 'smooth', block: 'end' });
            
            const history = getHistory();
            const apiMessages = history.map(m => ({role: m.role, content: m.content}));
            apiMessages.push({role: 'user', content: q});
            history.push({role: 'user', content: q});
            saveHistory(history);
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'agnes-2.5-pro',
                        messages: apiMessages,
                        max_tokens: 4000
                    })
                });
                
                const data = await response.json();
                const content = data.choices[0].message.content;
                
                history.push({role: 'assistant', content: content});
                saveHistory(history);
                
                typingDots.style.display = 'none';
                renderMessage('ai', content);
            } catch (err) {
                typingDots.style.display = 'none';
                renderMessage('ai', '❌ فشل الاتصال');
            }
            
            document.getElementById('sendBtn').disabled = false;
        }
        
        loadHistory();
    </script>
</body>
</html>
