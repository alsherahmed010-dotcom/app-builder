<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0d1117; height: 100vh; color: #e6edf3; display: flex; flex-direction: column; overflow: hidden; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 15px; align-items: center; flex-shrink: 0; }
        .nav-btn { padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 700; background: #21262d; color: #c9d1d9; cursor: pointer; border: none; }
        .chat-wrap { flex: 1; overflow-y: auto; max-width: 900px; width: 100%; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
        .msg { display: flex; gap: 12px; max-width: 90%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.ai { align-self: flex-start; }
        .av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: #238636; }
        .msg.user .av { background: #1f6feb; }
        .bub { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 14px 18px; font-size: 15px; line-height: 1.7; color: #fff; }
        .msg.user .bub { background: #1f6feb20; }
        .code-box { background: #010409; border: 1px solid #238636; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .code-header { background: #161b22; padding: 8px 15px; font-size: 12px; font-weight: bold; color: #8b949e; border-bottom: 1px solid #30363d; }
        .code { padding: 15px; font-family: monospace; font-size: 13px; color: #3fb950 !important; white-space: pre-wrap; word-wrap: break-word; max-height: 300px; overflow-y: auto; direction: ltr; text-align: left; }
        .acts { display: flex; gap: 8px; padding: 10px 15px; background: #161b22; border-top: 1px solid #30363d; }
        .ab { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; background: #21262d; color: #c9d1d9; text-decoration: none; }
        .ab.copy { background: #238636; color: white; }
        .ab.prev { background: #d29922; color: white; }
        .ab.use { background: #1f6feb; color: white; }
        .dots { display: flex; gap: 5px; height: 24px; }
        .dots span { width: 8px; height: 8px; background: #8b949e; border-radius: 50%; animation: b 1.4s infinite; }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes b { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .inp-wrap { background: #0d1117; padding: 15px 20px; border-top: 1px solid #30363d; flex-shrink: 0; }
        .inp-area { display: flex; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto; }
        .inp { flex: 1; padding: 15px 20px; background: #161b22; border: 2px solid #30363d; border-radius: 30px; color: #fff; font-size: 16px; font-family: inherit; outline: none; }
        .inp:focus { border-color: #1f6feb; }
        .snd { padding: 0 30px; background: #1f6feb; color: white; border: none; border-radius: 30px; font-weight: 700; cursor: pointer; font-size: 16px; }
        .snd:disabled { opacity: .5; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/create.html" class="nav-btn">➕ إنشاء</a>
        <button class="nav-btn" style="background:#1f6feb;color:white;" onclick="location.href='/ai-html.html'">🤖 AI</button>
        <a href="/my-apps.html" class="nav-btn">📱 تطبيقاتي</a>
    </nav>
    <div class="chat-wrap" id="wrap"></div>
    <div class="inp-wrap">
        <div class="inp-area">
            <input class="inp" id="inp" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key==='Enter')send()">
            <button class="snd" id="snd" onclick="send()">إرسال ➤</button>
        </div>
    </div>
    <script>
        const KEY = 'sk-eV8aSN0NWxNYGnTdvws5nIGAcMWvUk0G2i0u5MdGIdyl2H1Q';
        function hist() { try { return JSON.parse(localStorage.getItem('ai_chat') || '[]'); } catch { return []; } }
        function save(h) { localStorage.setItem('ai_chat', JSON.stringify(h)); }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function isH(s) { const t = s.trim(); return t.startsWith('<!DOCTYPE') || t.startsWith('<html') || (t.includes('<') && t.includes('</')); }
        
        function render(role, content) {
            const w = document.getElementById('wrap');
            const d = document.createElement('div');
            d.className = 'msg ' + role;
            
            if (role === 'ai' && content.includes('```')) {
                const parts = content.split(/(```[\s\S]*?```)/g);
                let inner = '<div class="av">🤖</div><div class="bub">';
                parts.forEach(part => {
                    if (part.startsWith('```') && part.endsWith('```')) {
                        const code = part.replace(/^```[a-z]*\n?/, '').replace(/```$/, '');
                        inner += `<div class="code-box"><div class="code-header">كود</div><pre class="code">${esc(code)}</pre><div class="acts"><button class="ab copy" onclick="cp(this)">📋 نسخ</button><button class="ab prev" onclick="sp(this)">👁️ معاينة</button><button class="ab use" onclick="us(this)">🚀 استخدام</button></div></div>`;
                    } else if (part.trim()) {
                        inner += `<div>${esc(part).replace(/\n/g, '<br>')}</div>`;
                    }
                });
                inner += '</div>';
                d.innerHTML = inner;
            } else if (role === 'ai' && isH(content)) {
                d.innerHTML = `<div class="av">🤖</div><div class="bub"><div>إليك الكود:</div><div class="code-box"><div class="code-header">HTML</div><pre class="code">${esc(content)}</pre><div class="acts"><button class="ab copy" onclick="cp(this)">📋 نسخ</button><button class="ab prev" onclick="sp(this)">👁️ معاينة</button><button class="ab use" onclick="us(this)">🚀 استخدام</button></div></div></div>`;
            } else {
                d.innerHTML = `<div class="av">${role === 'user' ? '👤' : '🤖'}</div><div class="bub">${esc(content).replace(/\n/g, '<br>')}</div>`;
            }
            
            w.appendChild(d);
            w.scrollTop = w.scrollHeight;
        }
        
        function load() {
            document.getElementById('wrap').innerHTML = '';
            const h = hist();
            if (h.length === 0) render('ai', 'مرحباً! اكتب سؤالك.');
            else h.forEach(m => render(m.role, m.content));
        }
        
        function cp(b) { navigator.clipboard.writeText(b.closest('.code-box').querySelector('.code').textContent).then(() => { b.textContent = '✅'; setTimeout(() => b.textContent = '📋 نسخ', 2000); }); }
        function sp(b) { localStorage.setItem('pv', b.closest('.code-box').querySelector('.code').textContent); window.open('/preview.html', '_blank'); }
        function us(b) { localStorage.setItem('gc', b.closest('.code-box').querySelector('.code').textContent); location.href = '/create.html'; }
        
        async function send() {
            const inp = document.getElementById('inp');
            const q = inp.value.trim();
            if (!q) return;
            
            render('user', q);
            inp.value = '';
            document.getElementById('snd').disabled = true;
            
            const typing = document.createElement('div');
            typing.className = 'msg ai';
            typing.id = 'typing';
            typing.innerHTML = '<div class="av">🤖</div><div class="bub"><div class="dots"><span></span><span></span><span></span></div></div>';
            document.getElementById('wrap').appendChild(typing);
            
            const h = hist();
            const api = h.map(m => ({role: m.role === 'ai' ? 'assistant' : m.role, content: m.content}));
            api.push({role: 'user', content: q});
            h.push({role: 'user', content: q});
            save(h);
            
            try {
                const r = await fetch('https://apihub.agnes-ai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify({model: 'agnes-2.5-pro', messages: api, max_tokens: 4000})
                });
                const data = await r.json();
                document.getElementById('typing')?.remove();
                
                if (data.choices && data.choices[0]) {
                    const content = data.choices[0].message.content;
                    h.push({role: 'assistant', content});
                    save(h);
                    render('ai', content);
                } else {
                    render('ai', '❌ ' + (data.error?.message || 'خطأ'));
                }
            } catch(e) {
                document.getElementById('typing')?.remove();
                render('ai', '❌ فشل الاتصال');
            }
            
            document.getElementById('snd').disabled = false;
            document.getElementById('inp').focus();
        }
        
        load();
        document.getElementById('inp').focus();
    </script>
</body>
</html>
