<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل التطبيق</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0d1117; min-height: 100vh; color: #e6edf3; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 15px; }
        .nav-btn { padding: 10px 25px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 700; }
        .nav-btn.active { background: #238636; color: white; }
        .nav-btn.inactive { background: #21262d; color: #c9d1d9; }
        .container { max-width: 600px; margin: 30px auto; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 30px 25px; }
        .card-title { font-size: 20px; font-weight: 800; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 700; color: #c9d1d9; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; font-size: 14px; color: #e6edf3; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #238636; }
        textarea { min-height: 150px; font-family: monospace; font-size: 13px; }
        .icon-upload { border: 2px dashed #30363d; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; }
        .icon-preview { width: 60px; height: 60px; border-radius: 15px; margin: 10px auto; object-fit: cover; }
        .save-btn { width: 100%; padding: 14px; background: #238636; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .build-btn { width: 100%; padding: 14px; background: #1f6feb; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .fps-buttons { display: flex; gap: 8px; }
        .fps-btn { flex: 1; padding: 10px; text-align: center; border: 2px solid #30363d; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; }
        .fps-btn.active { border-color: #238636; background: #23863620; color: #3fb950; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: auto; }
        .checkbox-group label { margin: 0; }
        .message-box { padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 13px; font-weight: 700; display: none; }
        .message-success { background: #23863630; color: #3fb950; display: block; }
        .message-warning { background: #d2992230; color: #d29922; display: block; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/create.html" class="nav-btn inactive">إنشاء</a>
        <a href="/my-apps.html" class="nav-btn active">تطبيقاتي</a>
    </nav>
    <div class="container">
        <div class="card">
            <div class="card-title">✏️ تعديل التطبيق</div>
            <div id="messageBox" class="message-box"></div>
            <form id="settingsForm">
                <div class="form-group">
                    <label>📝 اسم التطبيق</label>
                    <input type="text" id="appName" required>
                </div>
                <div class="form-group">
                    <label>📦 الباكدج نيم</label>
                    <input type="text" id="packageName" required>
                </div>
                <div class="form-group">
                    <label>🖼️ أيقونة التطبيق</label>
                    <div class="icon-upload" onclick="document.getElementById('appIcon').click()">
                        <img id="iconPreview" class="icon-preview">
                        <p style="font-size:12px;color:#8b949e;" id="iconText">اضغط لتغيير الأيقونة</p>
                    </div>
                    <input type="file" id="appIcon" accept="image/png" style="display:none;" onchange="previewIcon(this)">
                </div>
                <div class="form-group">
                    <label>📄 وصف</label>
                    <input type="text" id="appDescription">
                </div>
                <div class="form-group">
                    <label>⚡ FPS</label>
                    <div class="fps-buttons">
                        <div class="fps-btn" onclick="selectFps(this,90)">90</div>
                        <div class="fps-btn" onclick="selectFps(this,120)">120</div>
                        <div class="fps-btn" onclick="selectFps(this,144)">144</div>
                        <div class="fps-btn" onclick="selectFps(this,0)">تلقائي</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>👋 رسالة ترحيب</label>
                    <input type="text" id="welcomeMsg">
                </div>
                <div class="form-group">
                    <label>👋 رسالة خروج</label>
                    <input type="text" id="exitMsg">
                </div>
                <div id="htmlSection">
                    <div class="form-group">
                        <label>📄 كود HTML</label>
                        <textarea id="htmlCode"></textarea>
                    </div>
                </div>
                <div id="urlSection" style="display:none;">
                    <div class="form-group">
                        <label>🔗 رابط الموقع</label>
                        <input type="url" id="appUrl">
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="notifEnabled">
                        <label for="notifEnabled">🔔 الإشعارات</label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="admobEnabled">
                        <label for="admobEnabled">💰 AdMob</label>
                    </div>
                </div>
                <button type="submit" class="save-btn">💾 حفظ</button>
            </form>
            <button class="build-btn" onclick="rebuildApp()">🔨 إعادة بناء</button>
        </div>
    </div>
    <script>
        const API_URL = 'https://app-builder-production-ab4d.up.railway.app';
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('id');
        let currentApp = null;
        let selectedFps = 120;
        function selectFps(el, fps) { selectedFps = fps; document.querySelectorAll('.fps-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
        document.getElementById('admobEnabled').addEventListener('change', function() { document.getElementById('admobSection').style.display = this.checked ? 'block' : 'none'; });
        function previewIcon(input) { const f = input.files[0]; if (f) { const r = new FileReader(); r.onload = e => { document.getElementById('iconPreview').src = e.target.result; document.getElementById('iconPreview').style.display = 'block'; document.getElementById('iconText').textContent = '✅ ' + f.name; }; r.readAsDataURL(f); } }
        function showMessage(msg, type) { const box = document.getElementById('messageBox'); box.textContent = msg; box.className = 'message-box ' + (type === 'success' ? 'message-success' : 'message-warning'); box.style.display = 'block'; setTimeout(() => box.style.display = 'none', 5000); }
        async function loadApp() {
            try {
                const response = await fetch(`${API_URL}/api/apps/${appId}`);
                const data = await response.json();
                currentApp = data.app;
                document.getElementById('appName').value = currentApp.name;
                document.getElementById('packageName').value = currentApp.package_name;
                document.getElementById('appDescription').value = currentApp.description || '';
                document.getElementById('welcomeMsg').value = currentApp.welcome_message || '';
                document.getElementById('exitMsg').value = currentApp.exit_message || '';
                document.getElementById('notifEnabled').checked = currentApp.notification_enabled || false;
                document.getElementById('admobEnabled').checked = currentApp.admob_enabled || false;
                selectFps(document.querySelector('.fps-btn'), currentApp.fps || 0);
                if (currentApp.icon_url) { document.getElementById('iconPreview').src = API_URL + currentApp.icon_url; document.getElementById('iconPreview').style.display = 'block'; }
                if (currentApp.app_type === 'html') { document.getElementById('htmlSection').style.display = 'block'; document.getElementById('htmlCode').value = currentApp.content; }
                else { document.getElementById('urlSection').style.display = 'block'; document.getElementById('appUrl').value = currentApp.content; }
            } catch (error) { showMessage('❌ فشل التحميل', 'warning'); }
        }
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('name', document.getElementById('appName').value);
            fd.append('package_name', document.getElementById('packageName').value);
            fd.append('content', currentApp.app_type === 'html' ? document.getElementById('htmlCode').value : document.getElementById('appUrl').value);
            fd.append('description', document.getElementById('appDescription').value);
            fd.append('fps', selectedFps);
            fd.append('welcome_message', document.getElementById('welcomeMsg').value);
            fd.append('exit_message', document.getElementById('exitMsg').value);
            fd.append('notification_enabled', document.getElementById('notifEnabled').checked);
            fd.append('admob_enabled', document.getElementById('admobEnabled').checked);
            const iconFile = document.getElementById('appIcon').files[0];
            if (iconFile) fd.append('icon', iconFile);
            try {
                const response = await fetch(`${API_URL}/api/apps/${appId}`, { method: 'PUT', body: fd });
                const data = await response.json();
                if (data.success) { showMessage(data.message, data.needsNewVersion ? 'warning' : 'success'); }
                else { showMessage('❌ خطأ', 'warning'); }
            } catch (error) { showMessage('❌ فشل', 'warning'); }
        });
        function rebuildApp() { window.location.href = `/build.html?id=${appId}`; }
        loadApp();
    </script>
</body>
</html>
