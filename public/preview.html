<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0d1117; min-height: 100vh; }
        .toolbar { background: #161b22; padding: 12px 20px; border-bottom: 1px solid #30363d; display: flex; gap: 10px; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 999; }
        .back-btn { padding: 10px 25px; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; text-decoration: none; display: inline-block; }
        .back-btn:hover { background: #2ea043; }
        .frame-container { padding-top: 50px; width: 100%; height: calc(100vh - 50px); background: white; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="/ai-html.html" class="back-btn">← رجوع سريع</a>
    </div>
    <div class="frame-container">
        <iframe id="previewFrame"></iframe>
    </div>
    <script>
        const code = localStorage.getItem('preview-html') || '<h1>لا يوجد كود</h1>';
        const fullDoc = code.includes('<!DOCTYPE') ? code : `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head><body>${code}</body></html>`;
        document.getElementById('previewFrame').srcdoc = fullDoc;
    </script>
</body>
</html>
