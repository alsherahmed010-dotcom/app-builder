<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء تطبيق</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0d1117; min-height: 100vh; color: #e6edf3; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 15px; }
        .nav-btn { padding: 10px 25px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 700; }
        .nav-btn.active { background: #238636; color: white; }
        .nav-btn.inactive { background: #21262d; color: #c9d1d9; }
        .container { max-width: 600px; margin: 30px auto; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 30px 25px; }
        .card-title { font-size: 20px; font-weight: 800; margin-bottom: 25px; color: #f0f6fc; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 700; color: #c9d1d9; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; font-size: 14px; color: #e6edf3; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #238636; }
        textarea { min-height: 150px; font-family: monospace; font-size: 13px; }
        .icon-upload { border: 2px dashed #30363d; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; }
        .icon-upload:hover { border-color: #238636; }
        .icon-preview { width: 60px; height: 60px; border-radius: 15px; margin: 10px auto; display: none; object-fit: cover; }
        .type-buttons { display: flex; gap: 10px; margin-bottom: 18px; }
        .type-btn { flex: 1; padding: 12px; text-align: center; border: 2px solid #30363d; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; }
        .type-btn.active { border-color: #238636; background: #23863620; color: #3fb950; }
        .submit-btn { width: 100%; padding: 14px; background: #238636; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .submit-btn:hover { background: #2ea043; }
        .fps-buttons { display: flex; gap: 8px; }
        .fps-btn { flex: 1; padding: 10px; text-align: center; border: 2px solid #30363d; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; }
        .fps-btn.active { border-color: #238636; background: #23863620; color: #3fb950; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: auto; }
        .checkbox-group label { margin: 0; font-size: 13px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/create.html" class="nav-btn active">إنشاء</a>
        <a href="/my-apps.html" class="nav-btn inactive">تطبيقاتي</a>
    </nav>
    <div class="container">
        <div class="card">
            <div class="card-title">➕ إنشاء تطبيق جديد</div>
            <form id="createForm">
                <div class="form-group">
                    <label>📝 اسم التطبيق</label>
                    <input type="text" id="appName" required placeholder="مثال: تطبيقي">
                </div>
                <div class="form-group">
                    <label>📦 الباكدج نيم</label>
                    <input type="text" id="packageName" required placeholder="com.example.app">
                </div>
                <div class="form-group">
                    <label>🖼️ أيقونة التطبيق (PNG)</label>
                    <div class="icon-upload" onclick="document.getElementById('appIcon').click()">
                        <img id="iconPreview" class="icon-preview">
                        <p style="font-size:12px;color:#8b949e;" id="iconText">اضغط لاختيار PNG</p>
                    </div>
                    <input type="file" id="appIcon" accept="image/png" style="display:none;" onchange="previewIcon(this)">
                </div>
                <div class="form-group">
                    <label>📄 وصف التطبيق</label>
                    <input type="text" id="appDescription" placeholder="وصف مختصر">
                </div>
                <div class="form-group">
                    <label>⚡ FPS</label>
                    <div class="fps-buttons">
                        <div class="fps-btn active" onclick="selectFps(this,90)">90</div>
                        <div class="fps-btn" onclick="selectFps(this,120)">120</div>
                        <div class="fps-btn" onclick="selectFps(this,144)">144</div>
                        <div class="fps-btn" onclick="selectFps(this,0)">تلقائي</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>👋 رسالة ترحيب</label>
                    <input type="text" id="welcomeMsg" placeholder="أهلاً بك!">
                </div>
                <div class="form-group">
                    <label>👋 رسالة خروج</label>
                    <input type="text" id="exitMsg" placeholder="إلى اللقاء!">
                </div>
                <div class="type-buttons">
                    <div class="type-btn active" id="htmlBtn" onclick="selectType('html')">💻 HTML</div>
                    <div class="type-btn" id="webviewBtn" onclick="selectType('webview')">🌐 WebView</div>
                </div>
                <div id="htmlSection">
                    <div class="form-group">
                        <label>📄 كود HTML</label>
                        <textarea id="htmlCode" placeholder="<h1>مرحبا!</h1>"></textarea>
                    </div>
                </div>
                <div id="urlSection" style="display:none;">
                    <div class="form-group">
                        <label>🔗 رابط الموقع</label>
                        <input type="url" id="appUrl" placeholder="https://example.com">
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="notifEnabled">
                        <label for="notifEnabled">🔔 الإشعارات</label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="admobEnabled">
                        <label for="admobEnabled">💰 AdMob</label>
                    </div>
                </div>
                <div id="admobSection" style="display:none;">
                    <div class="form-group">
                        <label>📱 Banner ID</label>
                        <input type="text" id="admobBanner" placeholder="ca-app-pub-xxx/yyy">
                    </div>
                    <div class="form-group">
                        <label>🎬 Interstitial ID</label>
                        <input type="text" id="admobInterstitial" placeholder="ca-app-pub-xxx/zzz">
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">🚀 إنشاء التطبيق</button>
            </form>
        </div>
    </div>
    <script>
        const API_URL = 'https://app-builder-production-ab4d.up.railway.app';
        let appType = 'html';
        let selectedFps = 90;
        function selectType(type) { appType = type; document.getElementById('htmlBtn').classList.toggle('active', type==='html'); document.getElementById('webviewBtn').classList.toggle('active', type==='webview'); document.getElementById('htmlSection').style.display = type==='html' ? 'block' : 'none'; document.getElementById('urlSection').style.display = type==='webview' ? 'block' : 'none'; }
        function selectFps(el, fps) { selectedFps = fps; document.querySelectorAll('.fps-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
        document.getElementById('admobEnabled').addEventListener('change', function() { document.getElementById('admobSection').style.display = this.checked ? 'block' : 'none'; });
        function previewIcon(input) { const f = input.files[0]; if (f) { const r = new FileReader(); r.onload = e => { document.getElementById('iconPreview').src = e.target.result; document.getElementById('iconPreview').style.display = 'block'; document.getElementById('iconText').textContent = '✅ ' + f.name; }; r.readAsDataURL(f); } }
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = '⏳...';
            const fd = new FormData();
            fd.append('name', document.getElementById('appName').value);
            fd.append('package_name', document.getElementById('packageName').value);
            fd.append('app_type', appType);
            fd.append('content', appType === 'html' ? document.getElementById('htmlCode').value : document.getElementById('appUrl').value);
            fd.append('description', document.getElementById('appDescription').value);
            fd.append('fps', selectedFps);
            fd.append('welcome_message', document.getElementById('welcomeMsg').value);
            fd.append('exit_message', document.getElementById('exitMsg').value);
            fd.append('notification_enabled', document.getElementById('notifEnabled').checked);
            fd.append('admob_enabled', document.getElementById('admobEnabled').checked);
            fd.append('admob_banner_id', document.getElementById('admobBanner').value);
            fd.append('admob_interstitial_id', document.getElementById('admobInterstitial').value);
            const icon = document.getElementById('appIcon').files[0];
            if (icon) fd.append('icon', icon);
            try {
                const res = await fetch(`${API_URL}/api/apps`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) { window.location.href = `/build.html?id=${data.app.id}`; }
                else { alert('❌ ' + (data.error || 'خطأ')); btn.disabled = false; btn.textContent = '🚀 إنشاء التطبيق'; }
            } catch (err) { alert('❌ فشل'); btn.disabled = false; btn.textContent = '🚀 إنشاء التطبيق'; }
        });
    </script>
</body>
</html>
