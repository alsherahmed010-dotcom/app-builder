<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء تطبيق جديد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
        textarea { min-height: 200px; font-family: monospace; }
        .type-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .type-btn { flex: 1; padding: 15px; text-align: center; border: 3px solid #ddd; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        .type-btn.active { border-color: #667eea; background: #667eea10; }
        .type-btn .icon { font-size: 2em; display: block; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 1.2em; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { opacity: 0.9; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #667eea; text-decoration: none; }
        #htmlContent { display: none; }
        #urlContent { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ إنشاء تطبيق جديد</h1>
        <form id="createForm">
            <div class="form-group">
                <label>📝 اسم التطبيق</label>
                <input type="text" id="appName" required placeholder="مثال: تطبيقي الأول">
            </div>
            <div class="form-group">
                <label>📦 الباكدج نيم (Package Name)</label>
                <input type="text" id="packageName" required placeholder="com.example.myapp">
            </div>
            <div class="form-group">
                <label>🖼️ أيقونة التطبيق (PNG)</label>
                <input type="file" id="appIcon" accept="image/png">
            </div>
            <div class="type-buttons">
                <div class="type-btn active" id="htmlBtn" onclick="selectType('html')">
                    <span class="icon">💻</span>
                    HTML
                </div>
                <div class="type-btn" id="webviewBtn" onclick="selectType('webview')">
                    <span class="icon">🌐</span>
                    WebView
                </div>
            </div>
            <div id="htmlContent" style="display:block;">
                <div class="form-group">
                    <label>📄 كود HTML</label>
                    <textarea id="htmlCode" placeholder="<!DOCTYPE html>..."></textarea>
                </div>
            </div>
            <div id="urlContent">
                <div class="form-group">
                    <label>🔗 رابط الموقع</label>
                    <input type="url" id="appUrl" placeholder="https://example.com">
                </div>
            </div>
            <button type="submit" class="submit-btn">🚀 إنشاء التطبيق</button>
        </form>
        <a href="/" class="back-link">→ الرجوع للرئيسية</a>
    </div>
    <script>
        const API_URL = window.location.origin;
        let appType = 'html';
        
        function selectType(type) {
            appType = type;
            if (type === 'html') {
                document.getElementById('htmlBtn').classList.add('active');
                document.getElementById('webviewBtn').classList.remove('active');
                document.getElementById('htmlContent').style.display = 'block';
                document.getElementById('urlContent').style.display = 'none';
            } else {
                document.getElementById('webviewBtn').classList.add('active');
                document.getElementById('htmlBtn').classList.remove('active');
                document.getElementById('htmlContent').style.display = 'none';
                document.getElementById('urlContent').style.display = 'block';
            }
        }
        
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('appName').value);
            formData.append('package_name', document.getElementById('packageName').value);
            formData.append('app_type', appType);
            
            if (appType === 'html') {
                formData.append('content', document.getElementById('htmlCode').value);
            } else {
                formData.append('content', document.getElementById('appUrl').value);
            }
            
            const iconFile = document.getElementById('appIcon').files[0];
            if (iconFile) {
                formData.append('icon', iconFile);
            }
            
            try {
                const response = await fetch(`${API_URL}/api/apps`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    alert('✅ تم إنشاء التطبيق بنجاح!');
                    window.location.href = '/my-apps.html';
                } else {
                    alert('❌ حدث خطأ');
                }
            } catch (error) {
                alert('❌ فشل الاتصال بالسيرفر');
            }
        });
    </script>
</body>
</html>
