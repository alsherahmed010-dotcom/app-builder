<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0d1117; min-height: 100vh; color: #e6edf3; }
        .navbar { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: center; gap: 15px; }
        .nav-btn { padding: 10px 25px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 700; }
        .nav-btn.active { background: #238636; color: white; }
        .nav-btn.inactive { background: #21262d; color: #c9d1d9; }
        .container { max-width: 450px; margin: 80px auto; padding: 35px 25px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; text-align: center; }
        .logo { font-size: 50px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 800; margin-bottom: 30px; color: #f0f6fc; }
        .main-btn { display: block; padding: 16px; margin: 12px 0; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 700; }
        .btn-create { background: #238636; color: white; }
        .btn-create:hover { background: #2ea043; }
        .btn-apps { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-apps:hover { border-color: #8b949e; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-btn active">إنشاء</a>
        <a href="/my-apps.html" class="nav-btn inactive">تطبيقاتي</a>
    </nav>
    <div class="container">
        <div class="logo">🚀</div>
        <div class="title">أنشئ تطبيق أندرويد</div>
        <a href="/create.html" class="main-btn btn-create">➕ إنشاء تطبيق جديد</a>
        <a href="/my-apps.html" class="main-btn btn-apps">📱 تطبيقاتي</a>
    </div>
</body>
</html>
